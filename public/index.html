<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qistudio Paris · 预约</title>
<style>
  :root{
    --paper:#F3F0F4; --card:#FFF; --ink:#1F1A22; --muted:#8B8391; --line:#E4DFE9;
    --rose:#A82C4A; --teal:#3F7A6C; --gold:#A2823F; --amber:#C4802B;
    --serif: Didot,"Bodoni 72","Bodoni MT","Songti SC","Times New Roman",serif;
    --sans: -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --mono: "SF Mono",ui-monospace,Menlo,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;padding:0 0 128px}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,9vw,56px);margin:0;line-height:1}
  header{padding:24px 0 20px;text-align:center}
  .brand{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin-bottom:24px}
  .brand b{color:var(--ink);font-weight:600}
  .monthline{display:flex;align-items:center;justify-content:center;gap:20px}
  .monthline button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:transparent;color:var(--ink);cursor:pointer;font-size:15px}
  .monthline button:hover:not(:disabled){background:#fff;border-color:var(--ink)}
  .monthline button:disabled{opacity:.25;cursor:default}
  .yr{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--muted);margin-top:12px}
  .note{margin:20px auto 0;max-width:440px;font-size:13px;line-height:1.8;color:var(--muted)}
  .note b{color:var(--ink);font-weight:500}
  .legend{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:24px 0 16px;
    font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:8px}
  .chip{width:14px;height:9px;border-radius:5px;display:inline-block}
  .chip.teal{background:var(--teal)} .chip.rose{background:var(--rose)}
  .chip.gone{background:#D8D3DE} .chip.amber{background:var(--amber)}

  .cal{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 8px 8px;
    transition:opacity .15s}
  .cal.busy{opacity:.55}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px}
  .dow div{text-align:center;font-size:10px;letter-spacing:.16em;color:var(--muted);
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cell{position:relative;aspect-ratio:1/1.08;border:0;background:transparent;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;min-height:44px;
    font-family:var(--mono);font-size:13px;color:var(--ink);border-radius:3px;padding:0}
  .cell:hover:not(.dim):not(.sel){background:var(--paper)}
  .cell.dim{color:#CFC9D6;cursor:default}
  .cell.sel{background:var(--paper);color:var(--ink)}
  .dots{display:flex;gap:4px;height:8px;align-items:center}
  .dots i{width:5px;height:5px;border-radius:50%;display:block}
  .dots i.teal{background:var(--teal)} .dots i.rose{background:var(--rose)}
  .dots i.amber{background:var(--amber)} .dots i.gone{background:#DDD8E3}
  .tag{font-size:9px;font-family:var(--sans);letter-spacing:.08em;color:#BDB6C6}

  .day{margin-top:28px}
  .dayhead{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:12px;
    border-bottom:1px solid var(--line);margin-bottom:16px}
  .dayhead h2{font-family:var(--serif);font-weight:400;font-size:25px;margin:0}
  .dayhead em{font-style:normal;font-size:11px;letter-spacing:.2em;color:var(--muted);font-family:var(--mono)}
  .slot{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:0;margin-bottom:12px;display:flex;cursor:pointer;overflow:hidden;font-family:inherit;color:inherit}
  .slot:hover{border-color:#C9C2D2}
  .swatch{flex:0 0 56px;position:relative;background:var(--teal)}
  .slot.k-full .swatch{background:var(--rose)}
  .slot.st-pending .swatch{background:var(--amber)}
  .swatch::after{content:"";position:absolute;left:16px;top:12px;width:8px;bottom:12px;border-radius:6px;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.06))}
  .slot.off .swatch{background:#DCD7E2}
  .slot.off .swatch::after{opacity:.35}
  .bd{flex:1;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .t{font-family:var(--mono);font-size:19px} .t span{font-size:11px;color:var(--muted);margin-left:8px}
  .k{font-size:12px;color:var(--muted);margin-top:4px;display:block} .k b{color:var(--ink);font-weight:500}
  .state{font-size:11px;letter-spacing:.12em;color:var(--teal);white-space:nowrap;text-align:right}
  .slot.k-full .state{color:var(--rose)}
  .slot.st-pending .state{color:var(--amber)}
  .slot.off{background:#FAF9FB} .slot.off .t,.slot.off .k b,.slot.off .state{color:#B4AEBE}
  .slot.picked{border-color:var(--ink)} .slot.picked .state{color:var(--gold)}
  .empty{border:1px dashed var(--line);border-radius:4px;padding:28px;text-align:center;
    color:var(--muted);font-size:13px;line-height:1.9}
  .neterr,.msg{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rose);
    border-radius:3px;padding:12px 16px;font-size:13px;color:var(--muted);line-height:1.7}
  .neterr{margin-bottom:16px}
  .msg{margin-top:16px;background:var(--paper)}

  .sheet{position:fixed;inset:0;background:rgba(31,26,34,.45);z-index:40;display:flex;
    align-items:flex-end;justify-content:center}
  .sheet .in{background:var(--card);width:100%;max-width:520px;border-radius:6px 6px 0 0;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .sheet h3{font-family:var(--serif);font-weight:400;font-size:23px;margin:0 0 8px}
  .sheet .sub{font-size:12px;color:var(--muted);margin-bottom:20px;font-family:var(--mono)}
  .sheet.mid{align-items:center;padding:20px}
  .sheet.mid .in{border-radius:6px;max-width:420px;position:relative;padding:24px 20px}
  .sheet.mid h3{text-align:center;margin:0 0 20px;padding:0 32px}
  .x{position:absolute;left:14px;top:18px;width:32px;height:32px;border:0;background:transparent;
    color:var(--muted);font-size:14px;line-height:1;cursor:pointer;padding:0}
  .x:hover{color:var(--ink)}
  .done p{font-size:14px;line-height:1.9;color:var(--muted);margin:0 0 20px}
  .done .ct{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:12px 0;border-top:1px solid var(--line);font-size:13px}
  .done .ct b{font-family:var(--mono);font-weight:500;color:var(--ink)}
  .price{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:16px 0;border-top:1px solid var(--line)}
  .price .n{font-size:15px} .price .n span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
  .price .v{font-family:var(--mono);font-size:17px;white-space:nowrap}
  label{display:block;font-size:11px;letter-spacing:.14em;color:var(--muted);margin:16px 0 8px}
  input,textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:12px;min-height:44px;
    font-family:inherit;font-size:15px;background:#FCFBFD;color:var(--ink)}
  input:focus,textarea:focus{border-color:var(--ink)}
  input:focus:not(:focus-visible),textarea:focus:not(:focus-visible){outline:0}
  textarea{resize:vertical;min-height:64px}
  .btn{width:100%;border:0;border-radius:3px;padding:16px;font-family:var(--sans);font-size:14px;
    font-weight:500;cursor:pointer;margin-top:20px;background:var(--ink);color:#fff}
  .btn:hover{background:#37303C}
  .btn.ghost{background:transparent;color:var(--muted);margin-top:8px;padding:12px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;
    transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.7,.3,1);z-index:20}
  .bar.on{transform:none}
  .bar .in{max-width:760px;margin:0 auto;padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:16px}
  .bar .txt{flex:1;min-width:0}
  .bar .txt div:first-child{font-family:var(--mono);font-size:14px}
  .bar .txt div:last-child{font-size:11px;color:#A79FB2;margin-top:4px}
  .bar button{background:#fff;color:var(--ink);border:0;border-radius:2px;padding:12px 20px;min-height:44px;
    font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
  .mine{margin-top:32px}
  .mine h4{font-size:11px;letter-spacing:.2em;color:var(--muted);font-weight:400;margin:0 0 12px}
  .rq{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--amber);
    border-radius:3px;padding:12px 16px;margin-bottom:8px;font-size:13px;display:flex;
    justify-content:space-between;align-items:center;gap:12px}
  .rq.ok{border-left-color:var(--teal)} .rq.no{border-left-color:#C9C2D2;opacity:.6}
  .rq .s{font-size:11px;letter-spacing:.1em;color:var(--amber);white-space:nowrap}
  .rq.ok .s{color:var(--teal)} .rq.no .s{color:var(--muted)}
  .rq .m{font-family:var(--mono)}
  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;
    color:var(--muted);line-height:2;text-align:center}
  footer b{color:var(--ink);font-weight:500;font-family:var(--mono)}

  .topbar{display:flex;align-items:center;gap:12px;padding:16px 0 0}
  #langBtn,#priceBtn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:2px;
    padding:10px 14px;min-height:40px;font-family:var(--sans);font-size:11px;letter-spacing:.14em;cursor:pointer}
  #langBtn:hover,#priceBtn:hover{border-color:var(--ink);color:var(--ink)}
  #priceBtn{margin-left:auto}

  /* admin */
  #adminBtn{position:relative;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
    background:transparent;color:#C6C0D0;cursor:pointer;font-size:11px;padding:0}
  #adminBtn::after{content:"";position:absolute;inset:-9px}
  .abar{position:sticky;top:0;z-index:25;background:var(--gold);color:#fff;font-size:12px;
    padding:8px 16px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .abar button{background:rgba(255,255,255,.2);border:0;color:#fff;padding:12px;border-radius:2px;min-height:44px;
    cursor:pointer;font-size:12px}
  .abar button:hover{background:rgba(255,255,255,.33)}
  .inbox{margin:24px 0 0}
  .inbox h4{font-size:11px;letter-spacing:.2em;color:var(--muted);font-weight:400;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:12px}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
  .card .who{font-size:15px;font-weight:500}
  .card .when{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .card .meta{font-size:12px;color:var(--muted);line-height:1.8}
  .card .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .card .acts button{flex:1;min-width:96px;border:1px solid var(--line);background:#fff;border-radius:2px;
    padding:12px;min-height:44px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .card .acts button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  .card .acts button.warn{color:var(--rose)}
  .badge{display:inline-block;font-size:10px;letter-spacing:.1em;padding:4px 8px;border-radius:2px;
    background:#F1EDF5;color:var(--muted);margin-left:8px;vertical-align:middle}
  .badge.p{background:#FBF0E2;color:var(--amber)}
  .badge.a{background:#E9F1EF;color:var(--teal)}
  .badge.c{background:var(--ink);color:#fff}
  [hidden]{display:none!important}
  @media (max-width:520px){.wrap{padding:0 16px}.bd{padding:12px}.swatch{flex-basis:44px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>

<div class="abar" id="abar" hidden>
  <span id="pendCount">管理模式</span>
  <button id="offBtn" data-i="offBtn">当天休息</button>
  <button id="editBtn">关闭时段</button>
  <button id="quitBtn" data-i="quit">退出</button>
</div>

<div class="wrap">
  <div class="topbar">
    <button id="langBtn">English</button>
    <button id="adminBtn" aria-label="管理">·</button>
    <button id="priceBtn" data-i="pT">价格</button>
  </div>

  <header>
    <div class="brand"><b>Qistudio</b> Paris · Nail Atelier</div>
    <div class="monthline">
      <button id="prev" aria-label="上个月">‹</button><h1 id="mtitle">—</h1>
      <button id="next" aria-label="下个月">›</button>
    </div>
    <div class="yr" id="ytitle"></div>
    <p class="note"><span data-i="noteA"></span><b data-i="noteB"></b></p>
  </header>

  <div class="legend" id="legend"></div>

  <div class="neterr" id="neterr" hidden></div>

  <div class="cal">
    <div class="dow" id="dow"></div>
    <div class="grid" id="grid"></div>
  </div>

  <section class="day" id="day"></section>
  <section class="inbox" id="inbox" hidden></section>
  <section class="mine" id="mine" hidden></section>

  <footer><span id="ft1"></span> <b id="wxid"></b><br><span id="ft2"></span></footer>
</div>

<div class="bar" id="bar"><div class="in">
  <div class="txt"><div id="barT"></div><div id="barK"></div></div>
  <button id="goBtn" data-i="go">填写申请</button>
</div></div>

<div class="sheet" id="sheet" hidden><div class="in">
  <h3 id="shT" data-i="shT">提交预约申请</h3>
  <div class="sub" id="shSub"></div>
  <label data-i="lName">你的称呼</label><input id="fName" data-ph="phName">
  <label data-i="lWx">微信号</label><input id="fWx" data-ph="phWx">
  <label data-i="lNote">想做的款式 / 备注（可不填）</label><textarea id="fNote" data-ph="phNote"></textarea>
  <div class="msg" id="shMsg" hidden></div>
  <button class="btn" id="submitBtn" data-i="submit">提交申请</button>
  <button class="btn ghost" id="cancelBtn" data-i="back">再看看</button>
</div></div>

<div class="sheet" id="csheet" hidden><div class="in">
  <h3 id="cText"></h3>
  <button class="btn" id="cYes" data-i="yes">确定</button>
  <button class="btn ghost" id="cNo" data-i="no">再想想</button>
</div></div>

<div class="sheet mid" id="dsheet" hidden><div class="in done">
  <button class="x" id="dClose" data-al="close">✕</button>
  <h3 id="dT"></h3>
  <p id="dAsk"></p>
  <div class="ct"><span id="dWxL"></span><b id="dWx"></b></div>
  <div class="ct"><span>Instagram</span><b id="dIg"></b></div>
  <p id="dEnd" style="margin:20px 0 0"></p>
</div></div>

<div class="sheet mid" id="psheet" hidden><div class="in">
  <button class="x" id="pClose" data-al="close">✕</button>
  <h3 data-i="pT">价格</h3>
  <div id="pList"></div>
</div></div>

<div class="sheet" id="asheet" hidden><div class="in">
  <h3 data-i="aT">管理登录</h3>
  <label data-i="lPwd">密码</label><input id="aPwd" type="password" autocomplete="current-password">
  <div class="msg" id="aMsg" hidden></div>
  <button class="btn" id="aLogin" data-i="aEnter">进入</button>
  <button class="btn ghost" id="aCancel" data-i="aCancel">取消</button>
</div></div>

  "mineH":"My requests",
  "mst":{"pending":"Awaiting review","confirmed":"Confirmed ✓","declined":"Declined","cancelled":"Cancelled"},
  "adminMode":"Admin mode","pendA":"","pendB":" to review",
  "offBtn":"Close this day","editOff":"Close slots","editOn":"✓ Tap a slot","quit":"Log out",
  "inboxH":"This month","noReq":"No requests yet",
  "badge":{"pending":"To review","confirmed":"Confirmed"},
  "wxLabel":"WeChat","noteLabel":"Note: ",
  "bApprove":"Approve","bDecline":"Decline","bCancel":"Cancel",
  "askA":"Cancel the booking for ","askB":"?",
  "yes":"Confirm","no":"Go back",
  "aT":"Admin login","lPwd":"Password","aEnter":"Enter","aCancel":"Cancel","badPwd":"Wrong password",
  "pT":"Prices","perHour":"hour","close":"Close",
  "footWx":"Contact me on WeChat","footAddr":"exact address sent after confirmation"
}
}
</script>

<script>
const CFG=JSON.parse(document.getElementById("cfg").textContent);
const WECHAT=CFG.wechat, INSTA=CFG.instagram, DAYS_AHEAD=CFG.daysAhead,
      ADDR=CFG.addr, RULES=CFG.rules, KIND=CFG.kind;
const STR=JSON.parse(document.getElementById("i18n").textContent);

const CN=["日","一","二","三","四","五","六"];
const DOW_EN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];
let today=new Date(); today.setHours(0,0,0,0);
let view=new Date(today.getFullYear(),today.getMonth(),1);
let lang="zh";
let selDay=null,picked=null,admin=false,editMode=false,mine=[],inbox=[];
let db={req:{},blocked:{},off:{}};

const T=k=>STR[lang][k];
const zh=()=>lang==="zh";
const wd=d=>zh()?"周"+CN[d.getDay()]:DOW_EN[d.getDay()];
const md=d=>zh()?(d.getMonth()+1)+"月"+d.getDate()+"日":MON_EN[d.getMonth()].slice(0,3)+" "+d.getDate();
const dur=h=>zh()?"约"+h+"小时":h+" hrs";
const kLabel=k=>zh()?KIND[k].label:KIND[k].label_en;

const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const mkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const sid=(d,t)=>d+" "+t;
const endT=(t,h)=>pad((+t.slice(0,2)+h)%24)+":"+t.slice(3);
const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const note=t=>{const e=document.getElementById("neterr");e.textContent=t;e.hidden=!t;};

/* 预约窗口：今天起 DAYS_AHEAD 天，随当天日期滚动 */
let LAST,LASTM;
function setToday(){
  const n=new Date(); n.setHours(0,0,0,0); today=n;
  const l=new Date(n); l.setDate(l.getDate()+DAYS_AHEAD);
  LAST=key(l); LASTM=l.getFullYear()*12+l.getMonth();
}
setToday();

function reqAt(d,t){
  for(const id in db.req){const r=db.req[id];
    if(r.d===d&&r.t===t&&r.status!=="declined") return r;}
  return null;
}
function slotState(d,s){
  if(d>LAST) return "off";
  if(db.off[d]) return "off";
  if(db.blocked[sid(d,s.t)]) return "off";
  if(new Date(d+"T"+s.t+":00").getTime()<Date.now()) return "past";
  const r=reqAt(d,s.t);
  if(r) return r.status==="pending"?"pending":"taken";
  return "free";
}

/* ---------- 语言 ---------- */
function applyLang(){
  document.title=T("title");
  document.getElementById("langBtn").textContent=T("lang");
  document.getElementById("adminBtn").setAttribute("aria-label",T("admin"));
  document.getElementById("prev").setAttribute("aria-label",T("prevM"));
  document.getElementById("next").setAttribute("aria-label",T("nextM"));
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=T(e.dataset.i);});
  document.querySelectorAll("[data-ph]").forEach(e=>{e.placeholder=T(e.dataset.ph);});
  document.querySelectorAll("[data-al]").forEach(e=>{e.setAttribute("aria-label",T(e.dataset.al));});
  document.getElementById("dow").innerHTML=T("dow").map(d=>"<div>"+d+"</div>").join("");
  document.getElementById("legend").innerHTML=
    '<span><i class="chip teal"></i>'+kLabel("simple")+' · '+dur(KIND.simple.h)+'</span>'+
    '<span><i class="chip rose"></i>'+kLabel("full")+' · '+dur(KIND.full.h)+'</span>'+
    '<span><i class="chip amber"></i>'+T("st").pending+'</span>'+
    '<span><i class="chip gone"></i>'+T("legTaken")+'</span>';
  document.getElementById("editBtn").textContent=editMode?T("editOn"):T("editOff");
  document.getElementById("dT").textContent=T("okThanks");
  document.getElementById("dAsk").textContent=T("okAsk");
  document.getElementById("dWxL").textContent=T("wxLabel");
  document.getElementById("dEnd").textContent=T("okEnd");
  document.getElementById("pList").innerHTML=Object.keys(KIND).map(k=>
    '<div class="price"><span class="n">'+kLabel(k)+'<span>'+dur(KIND[k].h)+'</span></span>'+
    '<span class="v">'+KIND[k].price+' € / '+T("perHour")+'</span></div>').join("");
  document.getElementById("ft1").textContent=T("footWx");
  document.getElementById("ft2").textContent=ADDR+" · "+T("footAddr");
}
document.getElementById("langBtn").onclick=()=>{
  lang=zh()?"en":"zh";
  applyLang(); renderMonth(); renderDay(); renderBar(); renderInbox(); renderMine();
};

/* ---------- 存取 ---------- */
async function load(m){
  db={req:{},blocked:{},off:{}};
  const cal=document.querySelector(".cal"); cal.classList.add("busy");
  try{const r=await fetch("/api/month?m="+m);
    if(!r.ok) throw 0;
    const o=await r.json();
    o.bookings.forEach(b=>{db.req[b.id]=b;});
    o.exceptions.forEach(e=>{if(e.t) db.blocked[sid(e.d,e.t)]=1; else db.off[e.d]=1;});
    note("");
  }catch(e){note(T("loadFail"));}
  cal.classList.remove("busy");
}
async function refresh(){
  await load(mkey(view));
  if(admin) await loadInbox();
  renderMonth(); renderDay(); renderInbox();
}
async function toggleException(date,time){
  const r=await fetch("/api/admin/exception",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({date,time})}).catch(()=>null);
  await refresh();
  if(r&&r.status===409) note(T("exc409"));
}
async function loadMine(){
  try{const r=await fetch("/api/mine"); mine=(await r.json()).bookings;}catch(e){mine=[];}
}

/* ---------- 日历 ---------- */
function renderMonth(){
  setToday();
  document.getElementById("mtitle").textContent=zh()?(view.getMonth()+1)+"月":MON_EN[view.getMonth()];
  document.getElementById("ytitle").textContent=view.getFullYear();
  const first=new Date(view.getFullYear(),view.getMonth(),1);
  const lead=(first.getDay()+6)%7;
  const days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  const g=document.getElementById("grid"); g.innerHTML="";
  for(let i=0;i<lead;i++) g.appendChild(document.createElement("div"));
  for(let d=1;d<=days;d++){
    const date=new Date(view.getFullYear(),view.getMonth(),d), dk=key(date);
    const slots=RULES[date.getDay()]||[], sts=slots.map(s=>slotState(dk,s));
    const free=sts.filter(x=>x==="free").length;
    const beyond=dk>LAST;
    const gone=date<today||beyond||free===0;
    const b=document.createElement("button");
    b.className="cell"+((gone&&!admin)||beyond?" dim":"")+(selDay===dk?" sel":"");
    b.innerHTML="<span>"+d+"</span>";
    const dots=document.createElement("span"); dots.className="dots";
    slots.forEach((s,i)=>{const o=document.createElement("i");
      o.className=sts[i]==="free"?(s.k==="full"?"rose":"teal"):(sts[i]==="pending"?"amber":"gone");
      dots.appendChild(o);});
    b.appendChild(dots);
    if(db.off[dk]&&date>=today&&!beyond){const f=document.createElement("span");f.className="tag";f.textContent=T("tagOff");b.appendChild(f);}
    else if(slots.length&&free===0&&date>=today&&!beyond){const f=document.createElement("span");f.className="tag";f.textContent=T("tagFull");b.appendChild(f);}
    if((!gone||admin)&&!beyond) b.onclick=()=>{selDay=dk;picked=null;renderMonth();renderDay();renderBar();};
    else b.disabled=true;
    g.appendChild(b);
  }
  const cur=view.getFullYear()*12+view.getMonth(), now=today.getFullYear()*12+today.getMonth();
  document.getElementById("prev").disabled=cur<=now;
  document.getElementById("next").disabled=cur>=LASTM;
}

function renderDay(){
  const box=document.getElementById("day");
  if(!selDay){box.innerHTML="";return;}
  const date=new Date(selDay+"T00:00:00"), slots=RULES[date.getDay()]||[];
  let h='<div class="dayhead"><h2>'+md(date)+
        ' <span style="font-size:15px;color:var(--muted)">'+wd(date)+'</span>'+
        (db.off[selDay]?'<span class="badge">'+T("tagOff")+'</span>':'')+
        '</h2><em>'+selDay+'</em></div>';
  if(!slots.length){box.innerHTML=h+'<div class="empty">'+T("emptyDay")+'</div>';return;}
  slots.forEach(s=>{
    const st=slotState(selDay,s), info=KIND[s.k], r=reqAt(selDay,s.t);
    let label=T("st")[st];
    if(admin&&r) label=T("ast")[r.status]+(r.name?" · "+r.name:"");
    if(picked&&picked.t===s.t&&!admin) label=T("picked");
    const cls=["slot","k-"+s.k,"st-"+st,(st==="free"||st==="pending")?"":"off",
               (picked&&picked.t===s.t)?"picked":""].join(" ");
    h+='<button class="'+cls+'" data-t="'+s.t+'" data-k="'+s.k+'" data-st="'+st+'">'+
       '<span class="swatch"></span><span class="bd"><span>'+
       '<span class="t">'+s.t+'<span>— '+endT(s.t,info.h)+'</span></span>'+
       '<span class="k"><b>'+kLabel(s.k)+'</b> · '+dur(info.h)+'</span></span>'+
       '<span class="state">'+esc(label)+'</span></span></button>';
  });
  box.innerHTML=h;
  box.querySelectorAll(".slot").forEach(el=>{
    el.onclick=()=>{
      const t=el.dataset.t,k=el.dataset.k;
      if(admin&&editMode) return toggleException(selDay,t);
      if(admin) return;
      if(el.dataset.st!=="free") return;
      picked=(picked&&picked.t===t)?null:{d:selDay,t,k};
      renderDay(); renderBar();
    };
  });
}

function renderBar(){
  const bar=document.getElementById("bar");
  if(!picked||admin){bar.classList.remove("on");return;}
  const date=new Date(picked.d+"T00:00:00"), info=KIND[picked.k];
  document.getElementById("barT").textContent=(date.getMonth()+1)+"/"+date.getDate()+
    " "+wd(date)+"  "+picked.t;
  document.getElementById("barK").textContent=kLabel(picked.k)+" · "+dur(info.h);
  bar.classList.add("on");
}

/* ---------- 客人提交 ---------- */
document.getElementById("goBtn").onclick=()=>{
  if(!picked) return;
  const d=new Date(picked.d+"T00:00:00"), info=KIND[picked.k];
  document.getElementById("shSub").textContent=
    md(d)+" "+wd(d)+" · "+picked.t+" — "+endT(picked.t,info.h)+" · "+kLabel(picked.k);
  document.getElementById("sheet").hidden=false;
};
document.getElementById("cancelBtn").onclick=()=>{document.getElementById("sheet").hidden=true;msg("");};
const msg=t=>{const e=document.getElementById("shMsg");e.textContent=t;e.hidden=!t;};
document.getElementById("submitBtn").onclick=async()=>{
  const name=document.getElementById("fName").value.trim();
  const wx=document.getElementById("fWx").value.trim();
  if(!name) return msg(T("needName"));
  if(!wx) return msg(T("needWx"));
  msg("");
  const r=await fetch("/api/request",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({date:picked.d,time:picked.t,name,wechat:wx,
      note:document.getElementById("fNote").value.trim()})}).catch(()=>null);
  if(r&&r.status===409){msg(T("taken409"));await go();return;}
  if(!r||!r.ok) return msg(T("failSubmit"));
  document.getElementById("fName").value="";
  document.getElementById("fWx").value="";
  document.getElementById("fNote").value="";
  document.getElementById("sheet").hidden=true; msg("");
  document.getElementById("dsheet").hidden=false;
  await loadMine(); await go();
};

function renderMine(){
  const box=document.getElementById("mine");
  if(admin||!mine.length){box.hidden=true;return;}
  box.hidden=false;
  let h='<h4>'+T("mineH")+'</h4>';
  mine.forEach(r=>{
    const d=new Date(r.d+"T00:00:00");
    const cls=r.status==="confirmed"?"ok":(r.status==="declined"||r.status==="cancelled")?"no":"";
    h+='<div class="rq '+cls+'"><span class="m">'+(d.getMonth()+1)+'/'+d.getDate()+' '+r.t+
       ' · '+kLabel(r.k)+'</span><span class="s">'+T("mst")[r.status]+'</span></div>';
  });
  box.innerHTML=h;
}

/* ---------- 管理端 ---------- */
async function loadInbox(){
  try{const r=await fetch("/api/admin/month?m="+mkey(view));
    inbox=r.ok?(await r.json()).bookings:[];}catch(e){inbox=[];}
}
let askResolve=null;
const ask=t=>{document.getElementById("cText").textContent=t;
  document.getElementById("csheet").hidden=false;
  return new Promise(r=>{askResolve=r;});};
document.getElementById("cYes").onclick=()=>{document.getElementById("csheet").hidden=true;askResolve(true);};
document.getElementById("cNo").onclick=()=>{document.getElementById("csheet").hidden=true;askResolve(false);};

function renderInbox(){
  const box=document.getElementById("inbox");
  if(!admin){box.hidden=true;return;}
  box.hidden=false;
  const pend=inbox.filter(r=>r.status==="pending").length;
  document.getElementById("pendCount").textContent=pend?(T("pendA")+pend+T("pendB")):T("adminMode");
  if(!inbox.length){box.innerHTML='<h4>'+T("inboxH")+'</h4><div class="empty">'+T("noReq")+'</div>';return;}
  let h='<h4>'+T("inboxH")+'</h4>';
  inbox.forEach(r=>{
    const d=new Date(r.d+"T00:00:00"), info=KIND[r.k];
    const cl={pending:"p",confirmed:"c"}[r.status];
    const bg=cl?'<span class="badge '+cl+'">'+T("badge")[r.status]+'</span>':"";
    h+='<div class="card"><div class="top"><span class="who">'+esc(r.name)+bg+'</span>'+
       '<span class="when">'+(d.getMonth()+1)+'/'+d.getDate()+' '+wd(d)+' '+r.t+'</span></div>'+
       '<div class="meta">'+T("wxLabel")+' '+esc(r.wx)+' · '+kLabel(r.k)+' '+dur(info.h)+
       (r.note?'<br>'+T("noteLabel")+esc(r.note):'')+'</div><div class="acts">';
    if(r.status==="pending") h+='<button class="pri" data-a="confirmed" data-i2="'+r.id+'">'+T("bApprove")+'</button>'+
       '<button class="warn" data-a="declined" data-i2="'+r.id+'">'+T("bDecline")+'</button>';
    if(r.status==="confirmed") h+='<button class="warn" data-a="cancelled" data-i2="'+r.id+'">'+T("bCancel")+'</button>';
    h+='</div></div>';
  });
  box.innerHTML=h;
  box.querySelectorAll("[data-a]").forEach(b=>{
    b.onclick=async()=>{
      const a=b.dataset.a, r=inbox.find(x=>x.id===b.dataset.i2);
      if((a==="declined"||a==="cancelled")&&!await ask(T("askA")+r.name+T("askB"))) return;
      await fetch("/api/admin/booking/"+r.id+"/status",{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({status:a})}).catch(()=>null);
      await go();
    };
  });
}

/* ---------- 控制 ---------- */
document.getElementById("prev").onclick=()=>{view.setMonth(view.getMonth()-1);go();};
document.getElementById("next").onclick=()=>{view.setMonth(view.getMonth()+1);go();};
async function go(){selDay=null;picked=null;await load(mkey(view));
  if(admin) await loadInbox();
  renderMonth();renderDay();renderBar();renderInbox();renderMine();}

document.getElementById("adminBtn").onclick=()=>{
  if(admin) return;
  document.getElementById("aPwd").value="";
  document.getElementById("aMsg").hidden=true;
  document.getElementById("asheet").hidden=false;
};
document.getElementById("aCancel").onclick=()=>document.getElementById("asheet").hidden=true;
document.getElementById("aLogin").onclick=async()=>{
  const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password:document.getElementById("aPwd").value})}).catch(()=>null);
  if(!r||!r.ok){const e=document.getElementById("aMsg");e.textContent=T("badPwd");e.hidden=false;return;}
  document.getElementById("asheet").hidden=true;
  admin=true; document.getElementById("abar").hidden=false;
  document.getElementById("bar").classList.remove("on"); go();
};
document.getElementById("quitBtn").onclick=async()=>{
  await fetch("/api/admin/logout",{method:"POST"}).catch(()=>{});
  admin=false; editMode=false;
  document.getElementById("editBtn").textContent=T("editOff");
  document.getElementById("abar").hidden=true; go();
};
document.getElementById("editBtn").onclick=function(){
  editMode=!editMode; this.textContent=editMode?T("editOn"):T("editOff");
};
document.getElementById("offBtn").onclick=()=>{
  if(!selDay) return note(T("pickDay"));
  toggleException(selDay,null);
};

document.getElementById("priceBtn").onclick=()=>{document.getElementById("psheet").hidden=false;};
document.getElementById("pClose").onclick=()=>{document.getElementById("psheet").hidden=true;};
document.getElementById("dClose").onclick=()=>{document.getElementById("dsheet").hidden=true;};

const onBackdrop=(id,fn)=>{const s=document.getElementById(id);s.onclick=e=>{if(e.target===s)fn();};};
onBackdrop("sheet",()=>{document.getElementById("sheet").hidden=true;msg("");});
onBackdrop("dsheet",()=>{document.getElementById("dsheet").hidden=true;});
onBackdrop("psheet",()=>{document.getElementById("psheet").hidden=true;});
onBackdrop("asheet",()=>{document.getElementById("asheet").hidden=true;});
onBackdrop("csheet",()=>{document.getElementById("csheet").hidden=true;askResolve(false);});

document.getElementById("wxid").textContent=WECHAT;
document.getElementById("dWx").textContent=WECHAT;
document.getElementById("dIg").textContent=INSTA;
applyLang();
(async()=>{
  try{admin=(await (await fetch("/api/admin/session")).json()).admin;}catch(e){}
  if(admin) document.getElementById("abar").hidden=false;
  await loadMine(); await go();
})();
</script>
